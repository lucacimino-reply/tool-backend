services:
  frontend:
    image: studio-contact-frontend:render-submission-confirmation
    ports:
      - "8080:8080"
    environment:
      BACKEND_UPSTREAM: http://backend:3000

  backend:
    image: tool-backend:contact-submission-api
    environment:
      DATABASE_URL: postgres://studio_demo_user:demo_only_studio_password@database:5432/studio_contact_demo

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studio_contact_demo
      POSTGRES_USER: studio_demo_user
      POSTGRES_PASSWORD: demo_only_studio_password
