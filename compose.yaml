services:
  frontend:
    image: studio-contact-frontend:render-submission-confirmation
    ports:
      - "8080:8080"
    environment:
      BACKEND_UPSTREAM: http://backend:3000

  backend:
    image: tool-backend:contact-submission-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@database:5432/tool_backend

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tool_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
