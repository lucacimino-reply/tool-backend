services:
  frontend:
    image: clean-frontend:frontend-checkout-confirmation-review
    ports:
      - "8080:8080"
    environment:
      BACKEND_UPSTREAM: http://backend:3000
    depends_on:
      backend:
        condition: service_started

  backend:
    image: tool-backend:latest
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://clean_demo:clean_demo_password@database:5432/clean_demo
      SESSION_DURATION_HOURS: "24"
      MIGRATION_LOCK_TIMEOUT_MS: "30000"
      NODE_ENV: development
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clean_demo
      POSTGRES_USER: clean_demo
      POSTGRES_PASSWORD: clean_demo_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clean_demo -d clean_demo"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - clean_browser_verification_data:/var/lib/postgresql/data

volumes:
  clean_browser_verification_data:
